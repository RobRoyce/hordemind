name: One-time v2 dependency lockfile generation
on:
  push:
    branches: [feature/v2-foundation]
    paths: ['.github/workflows/generate-v2-lockfile.yml','apps/web/package.json']
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v2-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependency tree and write npm lockfile
        run: |
          cd apps/web
          npm install --package-lock-only --no-audit --no-fund
      - name: Commit reproducible dependency lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json
          git commit -m 'chore(v2): pin exact npm dependency graph'
          git push origin HEAD:feature/v2-foundation
