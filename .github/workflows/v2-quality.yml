name: V2 quality gate
on:
  pull_request:
    paths: ['apps/web/**','supabase/**','docs/adr/**','.github/workflows/v2-quality.yml']
  push:
    branches: ['feature/v2-foundation']
    paths: ['apps/web/**','supabase/**','docs/adr/**','.github/workflows/v2-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run local preview server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/hordemind-v2-vite.log 2>&1 &
          echo $! > /tmp/hordemind-v2-vite.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
      - run: node tests/e2e.mjs
