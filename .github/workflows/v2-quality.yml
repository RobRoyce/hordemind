name: V2 quality gate
on:
  push:
    branches: [main]
    paths: ['apps/web/**','supabase/**','.github/workflows/v2-quality.yml']
  pull_request:
    paths: ['apps/web/**','supabase/**','docs/adr/**','.github/workflows/v2-quality.yml']
  workflow_dispatch:
concurrency:
  group: v2-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: v2-validated-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Verify preinstalled Chrome browser
        run: command -v google-chrome-stable || command -v google-chrome
      - uses: actions/download-artifact@v4
        with:
          name: v2-validated-dist
          path: apps/web/dist
      - name: Run tested build preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/hordemind-v2-vite.log 2>&1 &
          echo $! > /tmp/hordemind-v2-vite.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
      - run: node tests/e2e.mjs

  database:
    name: Postgres migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start local Dockerized Postgres with Supabase schemas
        run: supabase db start
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Validate RLS, permissions and owner isolation
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f supabase/tests/security_invariants.sql
      - name: Stop local containers
        if: always()
        run: supabase stop || true

  deploy:
    name: Deploy validated v2 build to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, browser, database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: hordemind-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v2-validated-dist
          path: apps/web/dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist
      - name: Publish v2 only after all test and database gates pass
        id: deployment
        uses: actions/deploy-pages@v4

  verify-public:
    name: Verify public Pages release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify v2 HTML and JavaScript available over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base="https://robroyce.github.io/hordemind/"
          for attempt in $(seq 1 30); do
            if html="$(curl --fail --silent --show-error --location --max-time 12 "${base}?version=${GITHUB_SHA}")" && grep -q 'HordeMind 2' <<< "$html"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Published page did not return v2 HTML."
              exit 1
            fi
            sleep 5
          done
          js_path="$(grep -oE 'src="\./assets/[^"]+\.js"' <<< "$html" | head -n1 | cut -d '"' -f2)"
          test -n "$js_path" || { echo "::error::Vite JavaScript bundle missing from live HTML."; exit 1; }
          curl --fail --silent --show-error --location --max-time 15 "${base}${js_path#./}" --output /tmp/hordemind-v2-live.js
          bytes="$(wc -c < /tmp/hordemind-v2-live.js)"
          test "$bytes" -gt 3000 || { echo "::error::Live JavaScript bundle is unexpectedly small."; exit 1; }
          echo "Verified public HordeMind v2 HTML and ${bytes}-byte JS bundle."
