name: HordeMind regression tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/app.js && node --check src/engine.js && node --check src/catalog.js && node --check src/warplans.js && node --check src/strategy.js && node --check src/policy.js
      - run: node tests/engine.test.mjs && node tests/policy.test.mjs
